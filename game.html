<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <script src="game.js" defer></script>
</head>
<div class="game-container">
    <h1>🔮 Spell-Caster's Arena 🔮</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="instructions">Type the words appearing above the monster to cast your spells!</div>
</div>

<style>
    body {
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    h1 {
        color: #e0a96d;
        margin-bottom: 10px;
    }
    #gameCanvas {
        background-color: #2b2b2b;
        border: 4px solid #e0a96d;
        box-shadow: 0px 0px 20px rgba(224, 169, 109, 0.3);
        border-radius: 8px;
    }
    .instructions {
        margin-top: 15px;
        color: #a0a0a0;
        font-size: 14px;
    }
</style>
