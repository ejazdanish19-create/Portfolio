    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        .nav-divider {
            color: #444444;
            user-select: none;
        }

        .social-icons {
            display: flex;
            gap: 1.2rem;
        }

        .social-icons a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #ffffff;
        }

        
        .hero-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            width: 100%;
            margin: auto;
            padding: 0 4rem 4rem 4rem;
            flex-grow: 1;
            gap: 4rem;
        }

        .hero-text {
            max-width: 550px;
        }

        .hero-sub {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaaaaa;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .hero-description {
            font-size: 1.05rem;
            color: #888888;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .hero-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            border: 2px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .hero-btn:hover {
            background-color: #ffffff;
            color: #121212;
        }

        /* Hero Image Container */
        .hero-image-wrapper {
            flex-1: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }

        .hero-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
            /* Subtly darkened background blend to fit the dark aesthetic */
            mix-blend-mode: lighten; 
            opacity: 0.9;
        }

        
        @media (max-width: 968px) {
            header {
                padding: 2rem;
            }
            .hero-container {
                flex-direction: column-reverse;
                text-align: center;
                padding: 2rem;
                gap: 2rem;
            }
            .hero-title {
                font-size: 2.8rem;
            }
            nav {
                display: none; 
            }
        }
    </style>
</head>
